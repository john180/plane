name: plane-local-aio

x-backend-build: &backend-build
  context: ../../apps/api
  dockerfile: Dockerfile.api
  args:
    DOCKER_BUILDKIT: 1

x-backend-env: &backend-env
  WEB_URL: ${WEB_URL:-http://localhost}
  DEBUG: ${DEBUG:-0}
  SECRET_KEY: ${SECRET_KEY:-change-this-secret-key}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
  FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
  SIGNED_URL_EXPIRATION: ${SIGNED_URL_EXPIRATION:-3600}
  API_KEY_RATE_LIMIT: ${API_KEY_RATE_LIMIT:-60/minute}
  AUTHENTICATION_RATE_LIMIT: ${AUTHENTICATION_RATE_LIMIT:-10/minute}
  HARD_DELETE_AFTER_DAYS: ${HARD_DELETE_AFTER_DAYS:-60}
  DATABASE_URL: ${DATABASE_URL:-postgresql://plane:plane@plane-db:5432/plane}
  POSTGRES_USER: ${POSTGRES_USER:-plane}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
  POSTGRES_DB: ${POSTGRES_DB:-plane}
  POSTGRES_HOST: plane-db
  POSTGRES_PORT: 5432
  REDIS_HOST: plane-redis
  REDIS_PORT: 6379
  REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
  RABBITMQ_HOST: plane-mq
  RABBITMQ_PORT: 5672
  RABBITMQ_USER: ${RABBITMQ_USER:-plane}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-plane}
  RABBITMQ_VHOST: ${RABBITMQ_VHOST:-plane}
  AMQP_URL: ${AMQP_URL:-amqp://plane:plane@plane-mq:5672/plane}
  USE_MINIO: ${USE_MINIO:-1}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-access-key}
  AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-secret-key}
  AWS_S3_ENDPOINT_URL: ${AWS_S3_ENDPOINT_URL:-http://plane-minio:9000}
  AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
  MINIO_ENDPOINT_SSL: ${MINIO_ENDPOINT_SSL:-0}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost}
  APP_BASE_PATH: ${APP_BASE_PATH:-}
  ADMIN_BASE_URL: ${ADMIN_BASE_URL:-http://localhost}
  ADMIN_BASE_PATH: ${ADMIN_BASE_PATH:-/god-mode}
  SPACE_BASE_URL: ${SPACE_BASE_URL:-http://localhost}
  SPACE_BASE_PATH: ${SPACE_BASE_PATH:-/spaces}
  LIVE_BASE_URL: ${LIVE_BASE_URL:-http://localhost}
  LIVE_BASE_PATH: ${LIVE_BASE_PATH:-/live}
  LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-change-this-live-secret}
  WEBHOOK_ALLOWED_IPS: ${WEBHOOK_ALLOWED_IPS:-}
  WEBHOOK_ALLOWED_HOSTS: ${WEBHOOK_ALLOWED_HOSTS:-}

x-frontend-build-args: &frontend-build-args
  DOCKER_BUILDKIT: 1
  VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
  VITE_API_BASE_PATH: ${VITE_API_BASE_PATH:-/api}
  VITE_ADMIN_BASE_URL: ${VITE_ADMIN_BASE_URL:-}
  VITE_ADMIN_BASE_PATH: ${VITE_ADMIN_BASE_PATH:-/god-mode}
  VITE_SPACE_BASE_URL: ${VITE_SPACE_BASE_URL:-}
  VITE_SPACE_BASE_PATH: ${VITE_SPACE_BASE_PATH:-/spaces}
  VITE_LIVE_BASE_URL: ${VITE_LIVE_BASE_URL:-}
  VITE_LIVE_BASE_PATH: ${VITE_LIVE_BASE_PATH:-/live}
  VITE_WEB_BASE_URL: ${VITE_WEB_BASE_URL:-}
  VITE_WEB_BASE_PATH: ${VITE_WEB_BASE_PATH:-}
  VITE_WEBSITE_URL: ${VITE_WEBSITE_URL:-}
  VITE_SUPPORT_EMAIL: ${VITE_SUPPORT_EMAIL:-}

services:
  plane-db:
    image: postgres:15.7-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-plane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-plane}
      POSTGRES_DB: ${POSTGRES_DB:-plane}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./config/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-plane} -d ${POSTGRES_DB:-plane}"]
      interval: 10s
      timeout: 5s
      retries: 10

  plane-redis:
    image: valkey/valkey:7.2.11-alpine
    restart: unless-stopped
    command: ["valkey-server", "/etc/valkey/valkey.conf"]
    volumes:
      - ./data/redis:/data
      - ./config/valkey/valkey.conf:/etc/valkey/valkey.conf:ro
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  plane-mq:
    image: rabbitmq:3.13.6-management-alpine
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-plane}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-plane}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-plane}
    volumes:
      - ./data/rabbitmq:/var/lib/rabbitmq
      - ./config/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

  plane-minio:
    image: minio/minio:latest
    restart: unless-stopped
    entrypoint: >
      /bin/sh -c "
      mkdir -p /export/$${AWS_S3_BUCKET_NAME} &&
      minio server /export --console-address ':9090' &
      pid=$$! &&
      sleep 5 &&
      mc alias set local http://127.0.0.1:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/$${AWS_S3_BUCKET_NAME} || true &&
      wait $$pid
      "
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:-access-key}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:-secret-key}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
    volumes:
      - ./data/minio:/export
      - ./config/minio:/root/.minio
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrator:
    build: *backend-build
    restart: "no"
    command: ./bin/docker-entrypoint-migrator.sh
    environment: *backend-env
    volumes:
      - ./logs/migrator:/code/plane/logs
    depends_on:
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-minio:
        condition: service_healthy

  api:
    build: *backend-build
    restart: unless-stopped
    command: ./bin/docker-entrypoint-api.sh
    environment: *backend-env
    volumes:
      - ./logs/api:/code/plane/logs
    depends_on:
      migrator:
        condition: service_completed_successfully
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy
      plane-minio:
        condition: service_healthy

  worker:
    build: *backend-build
    restart: unless-stopped
    command: ./bin/docker-entrypoint-worker.sh
    environment: *backend-env
    volumes:
      - ./logs/worker:/code/plane/logs
    depends_on:
      api:
        condition: service_started
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy

  beat-worker:
    build: *backend-build
    restart: unless-stopped
    command: ./bin/docker-entrypoint-beat.sh
    environment: *backend-env
    volumes:
      - ./logs/beat-worker:/code/plane/logs
    depends_on:
      api:
        condition: service_started
      plane-db:
        condition: service_healthy
      plane-redis:
        condition: service_healthy
      plane-mq:
        condition: service_healthy

  live:
    build:
      context: ../..
      dockerfile: apps/live/Dockerfile.live
      args:
        DOCKER_BUILDKIT: 1
    restart: unless-stopped
    environment:
      PORT: 3000
      API_BASE_URL: http://api:8000
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      LIVE_BASE_PATH: ${LIVE_BASE_PATH:-/live}
      LIVE_SERVER_SECRET_KEY: ${LIVE_SERVER_SECRET_KEY:-change-this-live-secret}
      REDIS_URL: ${REDIS_URL:-redis://plane-redis:6379/}
    depends_on:
      api:
        condition: service_started
      plane-redis:
        condition: service_healthy

  web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile.web
      args: *frontend-build-args
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started

  admin:
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile.admin
      args: *frontend-build-args
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started

  space:
    build:
      context: ../..
      dockerfile: apps/space/Dockerfile.space
      args: *frontend-build-args
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started

  proxy:
    build:
      context: ../../apps/proxy
      dockerfile: Dockerfile.ce
    restart: unless-stopped
    environment:
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-5242880}
      BUCKET_NAME: ${AWS_S3_BUCKET_NAME:-uploads}
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      CERT_EMAIL: ${CERT_EMAIL:-}
      CERT_ACME_CA: ${CERT_ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
      CERT_ACME_DNS: ${CERT_ACME_DNS:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-0.0.0.0/0}
    ports:
      - "${LISTEN_HTTP_PORT:-80}:80"
      - "${LISTEN_HTTPS_PORT:-443}:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./data/caddy/config:/config
      - ./data/caddy/data:/data
    depends_on:
      web:
        condition: service_started
      admin:
        condition: service_started
      space:
        condition: service_started
      live:
        condition: service_started
      api:
        condition: service_started
      plane-minio:
        condition: service_healthy
